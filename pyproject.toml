[project]
name = "amb"
version = "0.1.0"
description = "Open Memory Benchmark"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12", "rich>=13", "rank-bm25>=0.2", "google-genai>=1.66.0",
    "python-dotenv>=1.0", "httpx>=0.27", "tiktoken>=0.12.0", "groq>=1.1.1",
    "openai>=1.0", "scipy>=1.11",
]

[project.optional-dependencies]
hindsight-http = ["hindsight-client>=0.9.2"]
# Opt into the original broad provider set; not needed by the local pilot.
all = [
    "amb[hindsight-http]", "datasets>=2.0", "mem0ai>=1.0.5", "cognee>=0.5.4",
    "sentence-transformers>=3.0", "hindsight-all>=0.4", "supermemory>=0.1",
    "qdrant-client>=1.13", "fastapi[standard]>=0.135.1", "uvicorn>=0.41.0",
]

[dependency-groups]
dev = ["pytest>=9"]

[project.scripts]
amb = "memory_bench.cli:app"
omb = "memory_bench.cli:app"  # legacy alias (pre-rename); prefer `amb`

[tool.hatch.build.targets.wheel]
packages = ["src/memory_bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
